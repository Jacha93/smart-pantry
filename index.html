<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/smart-pantry-favicon.png" />
    <link rel="apple-touch-icon" href="/smart-pantry-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Pantry</title>
    <meta name="description" content="AI-powered grocery inventory management with intelligent recipe suggestions" />
    <!-- Crypto Polyfill - Muss als erstes geladen werden -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        
        // Stelle sicher, dass window.crypto existiert
        if (!window.crypto) {
          window.crypto = {};
        }
        
        // Fallback-Funktion für randomUUID
        var fallbackRandomUUID = function () {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0;
            var v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
          });
        };
        
        // Setze Polyfill IMMER (auch wenn native Funktion existiert, als Fallback)
        try {
          if (!window.crypto.randomUUID || typeof window.crypto.randomUUID !== 'function') {
            Object.defineProperty(window.crypto, 'randomUUID', {
              value: fallbackRandomUUID,
              configurable: true,
              writable: true,
              enumerable: false,
            });
          }
        } catch (e) {
          try {
            window.crypto.randomUUID = fallbackRandomUUID;
          } catch (e2) {
            console.error('Failed to set crypto.randomUUID polyfill:', e2);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
