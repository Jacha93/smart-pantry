# ============================================
# Smart Pantry - Docker Compose (Production)
# ============================================
# Einzelnes Service: Frontend (Vite Build) + Backend (Python/FastAPI)
# Datenbank: Supabase (externe PostgreSQL, kein lokaler Service)
# ============================================

services:
  # ==========================================
  # Smart Pantry App (Frontend + Backend)
  # ==========================================
  smart-pantry-app:
    image: ghcr.io/jacha93/smart-pantry:latest
    container_name: smart-pantry-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Backend Port (intern im Container)
      BACKEND_PORT: 3001
      HOSTNAME: 0.0.0.0
      
      # Frontend Environment Variables (VITE_*)
      # Diese werden beim Build benötigt, aber auch zur Laufzeit für Runtime-Konfiguration
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_AUTH_DISABLED: ${VITE_AUTH_DISABLED:-false}
      
      # Datenbank: Supabase Connection String (kein lokaler PostgreSQL)
      DATABASE_URL: ${DATABASE_URL}
      
      # Backend API Keys
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY}
    
    # Port-Mapping: Frontend auf Port 3000 (konfigurierbar über FRONTEND_PORT)
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      # Optional: Backend direkt erreichbar (normalerweise nicht nötig, da über Nginx Proxy)
      # - "3001:3001"
    
    # Healthcheck (optional)
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
    #   interval: 5m
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
