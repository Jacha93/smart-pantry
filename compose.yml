# ============================================
# Smart Pantry - Docker Compose (Production)
# ============================================
# Zwei getrennte Deployables:
# - Marketing/Landingpage: statische öffentliche Seite
# - App: Frontend + FastAPI Backend in einem Container
# Datenbank: Supabase (externe PostgreSQL, kein lokaler Service)
# ============================================

services:
  # ==========================================
  # Smart Pantry Marketing / Landingpage
  # ==========================================
  smart-pantry-marketing:
    image: ghcr.io/jacha93/smart-pantry-marketing:latest
    container_name: smart-pantry-marketing
    restart: unless-stopped
    ports:
      - "${MARKETING_PORT:-3000}:3000"

  # ==========================================
  # Smart Pantry App (Frontend + Backend)
  # ==========================================
  smart-pantry-app:
    image: ghcr.io/jacha93/smart-pantry-app:latest
    container_name: smart-pantry-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Backend Port (intern im Container)
      BACKEND_PORT: 3001
      HOSTNAME: 0.0.0.0

      # Datenbank: Supabase Connection String (kein lokaler PostgreSQL)
      DATABASE_URL: ${DATABASE_URL}

      # Backend API Keys
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY}

    ports:
      - "${APP_PORT:-3001}:3000"
      # Optional: Backend direkt erreichbar
      # - "3002:3001"
