name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: app
            target: app-runner
            build_script: build:web
          - suffix: marketing
            target: marketing-runner
            build_script: build:marketing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smart-pantry-${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Generate custom version tags
        id: custom_tags
        run: |
          PACKAGE_VERSION=$(jq -r .version package.json)
          echo "Detected project version: $PACKAGE_VERSION"
          TAGS="${{ steps.meta.outputs.tags }}"
          REPO_LOWER=$(echo "${{ github.repository_owner }}/smart-pantry-${{ matrix.suffix }}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/$REPO_LOWER"

          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "Adding dev/nightly version tags..."
            TAGS="${TAGS}
            ${FULL_IMAGE_NAME}:v${PACKAGE_VERSION}-dev
            ${FULL_IMAGE_NAME}:v${PACKAGE_VERSION}-nightly"
          fi

          {
            echo 'final_tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILD_SCRIPT=${{ matrix.build_script }}
          push: true
          tags: ${{ steps.custom_tags.outputs.final_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release-on-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ -f CHANGELOG.md ]; then
            CHANGELOG_CONTENT=$(awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | sed '$d' || awk "/^## \[v${VERSION}\]/,/^## \[/" CHANGELOG.md | sed '$d' || echo "")

            if [ -n "$CHANGELOG_CONTENT" ]; then
              echo "Found changelog entry for version $VERSION"
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "No changelog entry found, using default notes"
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "## Release ${{ steps.version.outputs.tag }}" >> $GITHUB_OUTPUT
              echo "" >> $GITHUB_OUTPUT
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG.md not found, using default notes"
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "## Release ${{ steps.version.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Automated release from tag push." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
