name: Web Quality

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  web-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web
        run: npm run build:web

      - name: Check build budget
        run: npm run budget:web
